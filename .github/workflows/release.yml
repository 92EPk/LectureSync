# LectureSync — cross-platform release pipeline
#
# Triggers
#   • push a tag  vX.Y.Z           → build on Windows, Linux, macOS and publish a GitHub Release
#   • Actions tab → "Run workflow" → same builds, artifacts attached to the run only (no Release)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, script: build:win }
          - { name: linux,   os: ubuntu-latest,  script: build:linux }
          - { name: macos,   os: macos-latest,   script: build:mac }
    env:
      # Unsigned builds: stop electron-builder searching for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lecturesync-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: LectureSync ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
